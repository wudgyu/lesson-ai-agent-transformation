services:
  postgres:
    image: postgres:16.1
    environment:
      POSTGRES_USER: repomedic
      POSTGRES_PASSWORD: repomedic
      POSTGRES_DB: repomedic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomedic -d repomedic"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
